<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>L2</title>
<style>
body { margin:0; background:#f4f6f8; color:#1d2329; font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
main { max-width:44rem; margin:3rem auto; padding:2rem 2.2rem; background:#fff; border:1px solid #dde3e8; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
.level { font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:#5b6670; margin:0 0 .4rem; }
h1 { font-size:4rem; line-height:1.1; margin:0 0 1.2rem; color:#1a7f37; }
.note { color:#5b6670; border-top:1px solid #dde3e8; padding-top:1rem; }
a { color:#0b62c4; }
@media (max-width:600px){ main { margin:0; border-radius:0; padding:1.4rem 1rem; } h1 { font-size:3rem; } }
.fail { display: none; }
.result::before { content: "SUCCESS"; }
</style></head>
<body>
<main>
<p class="level">Level L2</p>
<h1 class="result"><span class="fail">FAIL</span></h1>
<p style="color: green" class="result-inline"><span style="display:none">FAIL: inline style ignored. </span>Inline style check: this line is green.</p>
<p class="note">L2 tests a &lt;style&gt; block and inline style attributes. Pass: big SUCCESS heading and no FAIL text anywhere. Without CSS you see FAIL.</p>
<p><a href="../">Back to all levels</a></p>
</main>
</body></html>
