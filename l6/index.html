<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>L6</title></head>
<body>
<h1 id="fetch">FAIL</h1>
<h1 id="timer">FAIL</h1>
<p>L6 tests network and timers. Pass: both headings read SUCCESS. The first comes from a fetched JSON file, the second from a setTimeout callback after one second. Any FAIL left means that part failed.</p>
<p><a href="../">Back to all levels</a></p>
<script>
fetch("result.json").then(function (r) { return r.json(); })
  .then(function (d) { document.getElementById("fetch").textContent = d.result + " (fetch)"; });
setTimeout(function () { document.getElementById("timer").textContent = "SUCCESS (timer)"; }, 1000);
</script>
</body></html>
